openapi: 3.0.3
info:
  title: GeoAlerta API
  version: 1.0.0
  description: >
    API RESTful da plataforma GeoAlerta — ponte entre o app mobile e o banco
    PostgreSQL. Construída com Servlets (Jakarta) + JDBC (padrão DAO), sem
    frameworks pesados. Os campos JSON usam `camelCase`.
servers:
  - url: /geoalerta-api
    description: Caminho de contexto padrão (mesma origem do deploy)
  - url: http://localhost:8080/geoalerta-api
    description: Desenvolvimento (Tomcat embarcado via `mvn cargo:run`)

tags:
  - name: Saúde
  - name: Alertas
  - name: Empresas
  - name: Sensores
  - name: Leituras

paths:
  /health:
    get:
      tags: [Saúde]
      summary: Status da API e do banco de dados
      responses:
        '200':
          description: Aplicação no ar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /alertas:
    get:
      tags: [Alertas]
      summary: Lista todos os alertas
      responses:
        '200':
          description: Lista de alertas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alerta' }
    post:
      tags: [Alertas]
      summary: Cria um alerta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertaInput' }
            example:
              nome: Tempestade Severa Litoral Sul
              tipo: Problemas climáticos
              grauGravidade: Alta
              dataDeEmissao: '2026-05-10T06:30:00'
              descricao: Ventos acima de 90 km/h e risco de alagamentos.
      responses:
        '201':
          description: Alerta criado
          headers:
            Location:
              description: URI do recurso criado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerta' }
        '400': { $ref: '#/components/responses/Erro400' }

  /alertas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Alertas]
      summary: Busca um alerta por id
      responses:
        '200':
          description: Alerta encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerta' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Alertas]
      summary: Atualiza um alerta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertaInput' }
      responses:
        '200':
          description: Alerta atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerta' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Alertas]
      summary: Remove um alerta
      responses:
        '204': { description: Removido com sucesso }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /alertas/{id}/leituras:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Alertas]
      summary: Lista as leituras que originaram o alerta
      description: >
        Leituras de sensores associadas ao alerta pela tabela de junção
        `sensoresalerta`.
      responses:
        '200':
          description: Leituras vinculadas ao alerta
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Leitura' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    post:
      tags: [Alertas]
      summary: Vincula leitura(s) ao alerta
      description: >
        Associa ao alerta as leituras que o ocasionaram. Envie um único
        `leituraId` ou uma lista `leituraIds`. Operação idempotente: vínculos
        já existentes são ignorados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoLeituraInput' }
            example:
              leituraIds: [1, 2, 3]
      responses:
        '201':
          description: Leituras vinculadas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Leitura' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /alertas/{id}/leituras/{leituraId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: leituraId
        in: path
        required: true
        description: Id da leitura a desvincular
        schema: { type: integer, format: int32, example: 1 }
    delete:
      tags: [Alertas]
      summary: Desvincula uma leitura do alerta
      responses:
        '204': { description: Vínculo removido }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /alertas/{id}/regioes:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Alertas]
      summary: Lista as regiões afetadas pelo alerta
      responses:
        '200':
          description: Regiões afetadas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Regiao' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    post:
      tags: [Alertas]
      summary: Adiciona uma região afetada ao alerta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegiaoInput' }
            example:
              erdPlusCode: 588MC9X8+5R
      responses:
        '201':
          description: Região adicionada
          headers:
            Location:
              description: URI do recurso criado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regiao' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /alertas/{id}/regioes/{regiaoId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: regiaoId
        in: path
        required: true
        description: Id da região afetada
        schema: { type: integer, format: int32, example: 1 }
    get:
      tags: [Alertas]
      summary: Busca uma região afetada
      responses:
        '200':
          description: Região encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regiao' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Alertas]
      summary: Atualiza uma região afetada
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegiaoInput' }
      responses:
        '200':
          description: Região atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regiao' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Alertas]
      summary: Remove uma região afetada
      responses:
        '204': { description: Removida com sucesso }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /empresas:
    get:
      tags: [Empresas]
      summary: Lista todas as empresas
      responses:
        '200':
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empresa' }
    post:
      tags: [Empresas]
      summary: Cadastra uma empresa
      description: >
        A `senha` é convertida em hash (SHA-256) antes de persistir e nunca é
        devolvida nas respostas. O CNPJ pode ser enviado com máscara.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpresaInput' }
            example:
              cnpj: '11.222.333/0001-81'
              nomeFantasia: Fazenda São João
              email: contato@fazendasaojoao.com.br
              senha: segredo123
      responses:
        '201':
          description: Empresa criada
          headers:
            Location:
              description: URI do recurso criado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '400': { $ref: '#/components/responses/Erro400' }
        '409': { $ref: '#/components/responses/Erro409' }

  /empresas/{cnpj}:
    parameters:
      - name: cnpj
        in: path
        required: true
        description: CNPJ (14 dígitos)
        schema: { type: string, example: '11222333000181' }
    get:
      tags: [Empresas]
      summary: Busca uma empresa por CNPJ
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Empresas]
      summary: Atualiza uma empresa
      description: >
        Informe `senha` apenas se quiser trocá-la; quando omitida, a senha
        atual é mantida.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpresaUpdate' }
      responses:
        '200':
          description: Empresa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Empresas]
      summary: Remove uma empresa
      responses:
        '204': { description: Removido com sucesso }
        '404': { $ref: '#/components/responses/Erro404' }

  /empresas/{cnpj}/notificacoes:
    parameters:
      - name: cnpj
        in: path
        required: true
        description: CNPJ (14 dígitos)
        schema: { type: string, example: '11222333000181' }
    get:
      tags: [Empresas]
      summary: Lista os alertas notificados à empresa
      description: >
        Alertas associados à empresa pela tabela de junção
        `notificacoesrecebidas`.
      responses:
        '200':
          description: Alertas notificados à empresa
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alerta' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    post:
      tags: [Empresas]
      summary: Registra notificação de alerta(s) à empresa
      description: >
        Marca os alertas como recebidos pela empresa. Envie um único `alertaId`
        ou uma lista `alertaIds`. Operação idempotente: vínculos já existentes
        são ignorados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoAlertaInput' }
            example:
              alertaIds: [1, 2, 3]
      responses:
        '201':
          description: Notificações registradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alerta' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /empresas/{cnpj}/notificacoes/{alertaId}:
    parameters:
      - name: cnpj
        in: path
        required: true
        description: CNPJ (14 dígitos)
        schema: { type: string, example: '11222333000181' }
      - name: alertaId
        in: path
        required: true
        description: Id do alerta cuja notificação será removida
        schema: { type: integer, format: int32, example: 1 }
    delete:
      tags: [Empresas]
      summary: Remove a notificação de um alerta da empresa
      responses:
        '204': { description: Notificação removida }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /empresas/{cnpj}/enderecos:
    parameters:
      - name: cnpj
        in: path
        required: true
        description: CNPJ (14 dígitos)
        schema: { type: string, example: '11222333000181' }
    get:
      tags: [Empresas]
      summary: Lista os endereços da empresa
      responses:
        '200':
          description: Endereços da empresa
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Endereco' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    post:
      tags: [Empresas]
      summary: Adiciona um endereço à empresa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnderecoInput' }
            example:
              erdPlusCode: 588MC9X8+5R
      responses:
        '201':
          description: Endereço adicionado
          headers:
            Location:
              description: URI do recurso criado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Endereco' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /empresas/{cnpj}/enderecos/{id}:
    parameters:
      - name: cnpj
        in: path
        required: true
        description: CNPJ (14 dígitos)
        schema: { type: string, example: '11222333000181' }
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Empresas]
      summary: Busca um endereço da empresa
      responses:
        '200':
          description: Endereço encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Endereco' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Empresas]
      summary: Atualiza um endereço da empresa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnderecoInput' }
      responses:
        '200':
          description: Endereço atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Endereco' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Empresas]
      summary: Remove um endereço da empresa
      responses:
        '204': { description: Removido com sucesso }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /sensores:
    get:
      tags: [Sensores]
      summary: Lista todos os sensores
      responses:
        '200':
          description: Lista de sensores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sensor' }
    post:
      tags: [Sensores]
      summary: Cadastra um sensor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorInput' }
            example:
              tipo: Estacao meteorologica
              erdPlusCode: 588MC9X8+5R
              status: ATIVO
              dataInstalacao: '2025-11-05T09:00:00'
      responses:
        '201':
          description: Sensor criado
          headers:
            Location:
              description: URI do recurso criado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/Erro400' }

  /sensores/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Sensores]
      summary: Busca um sensor por id
      responses:
        '200':
          description: Sensor encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Sensores]
      summary: Atualiza um sensor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorInput' }
      responses:
        '200':
          description: Sensor atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Sensores]
      summary: Remove um sensor
      responses:
        '204': { description: Removido com sucesso }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

  /leituras:
    get:
      tags: [Leituras]
      summary: Lista todas as leituras
      parameters:
        - name: sensorId
          in: query
          required: false
          description: Filtra as leituras de um sensor específico
          schema: { type: integer, format: int32, example: 1 }
      responses:
        '200':
          description: Lista de leituras
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Leitura' }
        '400': { $ref: '#/components/responses/Erro400' }
    post:
      tags: [Leituras]
      summary: Registra uma leitura
      description: >
        O `sensorId` deve referenciar um sensor existente. `dataHora` assume o
        instante atual quando omitida.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeituraInput' }
            example:
              sensorId: 1
              valor: 23.45
              unidadeMedida: °C
              dataHora: '2025-11-05T09:15:00'
      responses:
        '201':
          description: Leitura registrada
          headers:
            Location:
              description: URI do recurso criado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leitura' }
        '400': { $ref: '#/components/responses/Erro400' }

  /leituras/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Leituras]
      summary: Busca uma leitura por id
      responses:
        '200':
          description: Leitura encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leitura' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Leituras]
      summary: Atualiza uma leitura
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeituraInput' }
      responses:
        '200':
          description: Leitura atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leitura' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Leituras]
      summary: Remove uma leitura
      responses:
        '204': { description: Removido com sucesso }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador numérico
      schema: { type: integer, format: int32, example: 1 }

  responses:
    Erro400:
      description: Requisição inválida (validação)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { status: 400, erro: "O campo 'nome' e obrigatorio" }
    Erro404:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { status: 404, erro: 'Alerta 99 nao encontrado' }
    Erro409:
      description: Conflito (recurso já existe)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { status: 409, erro: 'Ja existe empresa com o CNPJ 11222333000181' }

  schemas:
    Alerta:
      type: object
      properties:
        id: { type: integer, format: int32, readOnly: true, example: 1 }
        nome: { type: string, maxLength: 60, example: Tempestade Severa Litoral Sul }
        tipo: { type: string, maxLength: 30, example: Problemas climáticos }
        grauGravidade: { type: string, maxLength: 20, example: Alta }
        dataDeEmissao:
          type: string
          format: date-time
          description: Data/hora ISO-8601 (padrão = agora, se omitida)
          example: '2026-05-10T06:30:00'
        descricao: { type: string, nullable: true, example: Ventos acima de 90 km/h. }
    AlertaInput:
      type: object
      required: [nome, tipo, grauGravidade]
      properties:
        nome: { type: string, maxLength: 60 }
        tipo: { type: string, maxLength: 30 }
        grauGravidade: { type: string, maxLength: 20 }
        dataDeEmissao: { type: string, format: date-time }
        descricao: { type: string, nullable: true }

    Empresa:
      type: object
      description: Representação de saída — nunca inclui a senha/hash.
      properties:
        cnpj: { type: string, example: '11222333000181' }
        nomeFantasia: { type: string, maxLength: 60, example: Fazenda São João }
        email: { type: string, format: email, maxLength: 255, example: contato@fazendasaojoao.com.br }
    EmpresaInput:
      type: object
      description: Corpo de criação (POST). Todos os campos são obrigatórios.
      required: [cnpj, nomeFantasia, email, senha]
      properties:
        cnpj: { type: string, description: '14 dígitos (aceita máscara)', example: '11.222.333/0001-81' }
        nomeFantasia: { type: string, maxLength: 60 }
        email: { type: string, format: email, maxLength: 255 }
        senha: { type: string, minLength: 6, writeOnly: true }
    EmpresaUpdate:
      type: object
      description: >
        Corpo de atualização (PUT). O CNPJ vem na URL (ignorado no corpo) e a
        senha é opcional — quando omitida, a senha atual é mantida.
      required: [nomeFantasia, email]
      properties:
        nomeFantasia: { type: string, maxLength: 60 }
        email: { type: string, format: email, maxLength: 255 }
        senha: { type: string, minLength: 6, writeOnly: true }

    Sensor:
      type: object
      properties:
        id: { type: integer, format: int32, readOnly: true, example: 1 }
        tipo: { type: string, maxLength: 30, example: Estacao meteorologica }
        erdPlusCode: { type: string, maxLength: 11, example: 588MC9X8+5R }
        status:
          type: string
          enum: [ATIVO, SUSPENSO, DESATIVADO]
          example: ATIVO
        dataInstalacao: { type: string, format: date-time, example: '2025-11-05T09:00:00' }
    SensorInput:
      type: object
      required: [tipo, erdPlusCode, status]
      properties:
        tipo: { type: string, maxLength: 30 }
        erdPlusCode: { type: string, maxLength: 11 }
        status: { type: string, enum: [ATIVO, SUSPENSO, DESATIVADO] }
        dataInstalacao: { type: string, format: date-time }

    Leitura:
      type: object
      properties:
        id: { type: integer, format: int32, readOnly: true, example: 1 }
        sensorId: { type: integer, format: int32, description: Sensor que originou a leitura, example: 1 }
        valor: { type: number, description: 'Valor medido (DECIMAL(10,5))', example: 23.45 }
        unidadeMedida: { type: string, maxLength: 5, example: °C }
        dataHora: { type: string, format: date-time, example: '2025-11-05T09:15:00' }
    LeituraInput:
      type: object
      required: [sensorId, valor, unidadeMedida]
      properties:
        sensorId: { type: integer, format: int32, description: Deve referenciar um sensor existente }
        valor: { type: number }
        unidadeMedida: { type: string, maxLength: 5 }
        dataHora: { type: string, format: date-time }

    VinculoLeituraInput:
      type: object
      description: >
        Vínculo de leituras a um alerta. Informe `leituraId` (único) e/ou
        `leituraIds` (lista) — ao menos um é obrigatório.
      properties:
        leituraId: { type: integer, format: int32, example: 1 }
        leituraIds:
          type: array
          items: { type: integer, format: int32 }
          example: [1, 2, 3]

    Endereco:
      type: object
      properties:
        id: { type: integer, format: int32, readOnly: true, example: 1 }
        cnpj: { type: string, readOnly: true, example: '11222333000181' }
        erdPlusCode: { type: string, maxLength: 11, example: 588MC9X8+5R }
    EnderecoInput:
      type: object
      description: O CNPJ vem na URL; o corpo carrega apenas o Plus Code.
      required: [erdPlusCode]
      properties:
        erdPlusCode: { type: string, maxLength: 11 }

    Regiao:
      type: object
      properties:
        id: { type: integer, format: int32, readOnly: true, example: 1 }
        alertaId: { type: integer, format: int32, readOnly: true, example: 1 }
        erdPlusCode: { type: string, maxLength: 11, example: 588MC9X8+5R }
    RegiaoInput:
      type: object
      description: O id do alerta vem na URL; o corpo carrega apenas o Plus Code.
      required: [erdPlusCode]
      properties:
        erdPlusCode: { type: string, maxLength: 11 }

    VinculoAlertaInput:
      type: object
      description: >
        Notificação de alertas a uma empresa. Informe `alertaId` (único) e/ou
        `alertaIds` (lista) — ao menos um é obrigatório.
      properties:
        alertaId: { type: integer, format: int32, example: 1 }
        alertaIds:
          type: array
          items: { type: integer, format: int32 }
          example: [1, 2, 3]

    Erro:
      type: object
      properties:
        status: { type: integer, format: int32, example: 404 }
        erro: { type: string, example: 'Alerta 99 nao encontrado' }

    Health:
      type: object
      required: [aplicacao, versao, bancoDeDados]
      properties:
        aplicacao: { type: string, example: GeoAlerta API }
        versao: { type: string, example: 1.0.0 }
        bancoDeDados:
          type: string
          description: '"conectado" ou "indisponivel: <motivo>"'
          example: conectado
        recursos:
          type: object
          additionalProperties: { type: string }
          example:
            alertas: /alertas
            empresas: /empresas
            sensores: /sensores
            leituras: /leituras
        documentacao:
          type: object
          additionalProperties: { type: string }
          example:
            swaggerUI: /geoalerta-api/swagger.html
            openapi: /geoalerta-api/openapi.yaml
